<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffe3ea" />
  <meta name="description" content="一封带着 Kitty 的信,请轻轻拆开 💌" />
  <title>一封给你的信 💌</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-scene="fly">

  <!-- ══════════ 背景装饰 ══════════ -->
  <div class="bg-dots" aria-hidden="true"></div>
  <div class="bg-hearts" aria-hidden="true">
    <span style="--x:8%;  --d:0s;   --s:1;  --c:#ffb6c6">❤</span>
    <span style="--x:22%; --d:2.2s; --s:.7; --c:#ffd1dc">❤</span>
    <span style="--x:37%; --d:4.1s; --s:1.2; --c:#ff9db2">❤</span>
    <span style="--x:52%; --d:1.3s; --s:.8; --c:#ffc2ce">❤</span>
    <span style="--x:67%; --d:3.4s; --s:1;  --c:#ffb6c6">❤</span>
    <span style="--x:81%; --d:.6s;  --s:.9; --c:#ffd1dc">❤</span>
    <span style="--x:93%; --d:2.9s; --s:1.1; --c:#ff9db2">❤</span>
  </div>

  <!-- ══════════ 音乐按钮 & 提示 ══════════ -->
  <button id="musicBtn" class="music-btn" type="button" aria-label="播放或暂停背景音乐">
    <svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13c0 .8.9 1.3 1.6.9l10-6.5c.6-.4.6-1.4 0-1.8l-10-6.5c-.7-.4-1.6.1-1.6.9z"/></svg>
    <svg class="icon icon-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.6"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.6"/></svg>
    <span class="music-btn__label">音乐</span>
  </button>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <main class="stage">

    <!-- ══════════ 场景一:Kitty 带着信封飞来 ══════════ -->
    <section class="scene scene--fly" id="sceneFly" aria-label="Kitty 带着信封飞来">
      <button class="flyer" id="flyer" type="button" aria-label="点击拆开信封">
        <svg class="flyer__art" viewBox="0 0 280 250" role="img" aria-label="Kitty 拍着翅膀抱着信封飞来">
          <!-- 速度线 -->
          <g class="speed" stroke="#ffc2ce" stroke-width="5" stroke-linecap="round" fill="none">
            <path d="M18 96 q22 -8 44 -4" />
            <path d="M8 136 q24 -8 48 -4" />
            <path d="M20 176 q20 -7 40 -3" />
          </g>
          <!-- 星星 -->
          <g class="sparkles" fill="#ffd766">
            <path class="tw tw-1" d="M242 58 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 z" />
            <path class="tw tw-2" d="M256 132 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" />
            <path class="tw tw-3" d="M40 42 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" />
          </g>

          <!-- 翅膀 -->
          <g class="wing wing--l">
            <path d="M124 132 C86 92 52 80 38 84 C46 108 62 132 102 152 C110 156 118 150 124 132 Z"
                  fill="#fffdfb" stroke="#f0bcc8" stroke-width="3" stroke-linejoin="round"/>
            <path d="M60 96 C78 108 92 122 104 138" stroke="#f7d3db" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M52 116 C72 122 88 132 100 146" stroke="#f7d3db" stroke-width="3" fill="none" stroke-linecap="round"/>
          </g>
          <g class="wing wing--r">
            <path d="M156 132 C194 92 228 80 242 84 C234 108 218 132 178 152 C170 156 162 150 156 132 Z"
                  fill="#fffdfb" stroke="#f0bcc8" stroke-width="3" stroke-linejoin="round"/>
            <path d="M220 96 C202 108 188 122 176 138" stroke="#f7d3db" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M228 116 C208 122 192 132 180 146" stroke="#f7d3db" stroke-width="3" fill="none" stroke-linecap="round"/>
          </g>

          <!-- 尾巴 -->
          <path d="M188 196 q34 2 42 -22 q4 26 -18 38 q-18 6 -24 -16 z" fill="#fffdfb" stroke="#f0bcc8" stroke-width="3" stroke-linejoin="round"/>

          <!-- 身体 -->
          <ellipse cx="140" cy="180" rx="56" ry="46" fill="#fffdfb" stroke="#f0bcc8" stroke-width="3.5"/>
          <!-- 脚 -->
          <ellipse cx="116" cy="222" rx="17" ry="10" fill="#fffdfb" stroke="#f0bcc8" stroke-width="3"/>
          <ellipse cx="164" cy="222" rx="17" ry="10" fill="#fffdfb" stroke="#f0bcc8" stroke-width="3"/>

          <!-- 头 -->
          <circle cx="140" cy="102" r="52" fill="#fffdfb" stroke="#f0bcc8" stroke-width="3.5"/>
          <!-- 耳朵 -->
          <path d="M99 66 L104 24 L141 52 Z" fill="#fffdfb" stroke="#f0bcc8" stroke-width="3.5" stroke-linejoin="round"/>
          <path d="M108 60 L111 38 L131 54 Z" fill="#ffd7e0"/>
          <path d="M181 66 L176 24 L139 52 Z" fill="#fffdfb" stroke="#f0bcc8" stroke-width="3.5" stroke-linejoin="round"/>
          <path d="M172 60 L169 38 L149 54 Z" fill="#ffd7e0"/>
          <!-- 蝴蝶结 -->
          <g class="bow">
            <path d="M181 34 C168 18 152 22 154 38 C156 52 172 52 181 42 Z" fill="#e8455f" stroke="#c9334c" stroke-width="3" stroke-linejoin="round"/>
            <path d="M185 34 C198 18 214 22 212 38 C210 52 194 52 185 42 Z" fill="#e8455f" stroke="#c9334c" stroke-width="3" stroke-linejoin="round"/>
            <circle cx="183" cy="38" r="8" fill="#ff6b81" stroke="#c9334c" stroke-width="3"/>
          </g>
          <!-- 脸:闭眼笑 -->
          <path d="M112 102 q8 -11 16 0" stroke="#4a3036" stroke-width="4.5" fill="none" stroke-linecap="round"/>
          <path d="M152 102 q8 -11 16 0" stroke="#4a3036" stroke-width="4.5" fill="none" stroke-linecap="round"/>
          <!-- 腮红 -->
          <ellipse cx="112" cy="118" rx="11" ry="7" fill="#ffc6d2" opacity=".85"/>
          <ellipse cx="168" cy="118" rx="11" ry="7" fill="#ffc6d2" opacity=".85"/>
          <!-- 鼻子 -->
          <ellipse cx="140" cy="116" rx="7" ry="5" fill="#f7b733"/>
          <!-- 胡须 -->
          <g stroke="#e5a8b5" stroke-width="3" stroke-linecap="round">
            <path d="M84 108 H104"/><path d="M84 120 H104"/><path d="M86 132 H105"/>
            <path d="M176 108 H196"/><path d="M176 120 H196"/><path d="M175 132 H194"/>
          </g>

          <!-- 抱着的信封 -->
          <g class="parcel">
            <rect x="92" y="150" width="96" height="66" rx="9" fill="#ffe0e8" stroke="#e8919f" stroke-width="3.5"/>
            <path d="M92 158 L140 192 L188 158" fill="none" stroke="#e8919f" stroke-width="3.5" stroke-linejoin="round"/>
            <path d="M140 202 c-12 -9 -18 -15 -18 -21 c0 -5 4 -8 8 -8 c3 0 7 2 10 6 c3 -4 7 -6 10 -6 c4 0 8 3 8 8 c0 6 -6 12 -18 21 z" fill="#e8455f"/>
            <!-- 爪子 -->
            <circle cx="100" cy="196" r="15" fill="#fffdfb" stroke="#f0bcc8" stroke-width="3.5"/>
            <circle cx="180" cy="196" r="15" fill="#fffdfb" stroke="#f0bcc8" stroke-width="3.5"/>
          </g>
        </svg>
        <span class="flyer__pulse" aria-hidden="true"></span>
      </button>
      <p class="hint" id="flyHint">轻点 Kitty 怀里的信封,拆开看看 ✨</p>
    </section>

    <!-- ══════════ 场景二:信封(不含"重新折好信件"按钮) ══════════ -->
    <section class="scene scene--envelope" id="sceneEnvelope" aria-label="信封" hidden>
      <button class="envelope-wrap" id="envelopeBtn" type="button" aria-label="点击打开信封,展开信纸">
        <svg class="envelope-art" viewBox="0 0 400 300" role="img" aria-label="一封贴着 Kitty 贴纸的信封">
          <!-- 影子 -->
          <ellipse cx="200" cy="278" rx="150" ry="14" fill="#f3b9c8" opacity=".35"/>

          <!-- 飘浮小爱心 -->
          <g class="env-sparkles" fill="#ff9db2">
            <path class="es es-1" d="M46 60 c-6 -8 -18 -4 -18 5 c0 7 8 12 18 19 c10 -7 18 -12 18 -19 c0 -9 -12 -13 -18 -5 z"/>
            <path class="es es-2" d="M352 92 c-5 -7 -15 -4 -15 4 c0 6 7 10 15 16 c8 -6 15 -10 15 -16 c0 -8 -10 -11 -15 -4 z"/>
            <path class="es es-3" d="M330 34 c-4 -5 -11 -3 -11 3 c0 4 5 8 11 12 c6 -4 11 -8 11 -12 c0 -6 -7 -8 -11 -3 z"/>
          </g>

          <!-- 信封本体 -->
          <rect x="42" y="66" width="316" height="196" rx="16" fill="#fff6ee" stroke="#e8919f" stroke-width="4"/>
          <rect x="56" y="80" width="288" height="168" rx="10" fill="none" stroke="#f7c6d1" stroke-width="2.5" stroke-dasharray="3 9" stroke-linecap="round"/>

          <!-- 收件人线条 -->
          <g fill="#f6d8de">
            <rect x="86" y="196" width="150" height="9" rx="4.5"/>
            <rect x="86" y="218" width="108" height="9" rx="4.5"/>
          </g>

          <!-- 邮票 -->
          <g>
            <rect x="282" y="92" width="66" height="80" rx="7" fill="#fff0f3" stroke="#e0607a" stroke-width="3" stroke-dasharray="6 5"/>
            <circle cx="315" cy="122" r="17" fill="#fffdfb" stroke="#f0bcc8" stroke-width="2.5"/>
            <path d="M302 112 L304 100 L316 110 Z" fill="#fffdfb" stroke="#f0bcc8" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M328 112 L326 100 L314 110 Z" fill="#fffdfb" stroke="#f0bcc8" stroke-width="2.5" stroke-linejoin="round"/>
            <circle cx="309" cy="121" r="2.2" fill="#4a3036"/>
            <circle cx="321" cy="121" r="2.2" fill="#4a3036"/>
            <ellipse cx="315" cy="127" rx="3.2" ry="2.4" fill="#f7b733"/>
            <text x="315" y="160" text-anchor="middle" font-size="13" fill="#e0607a" font-weight="700">Kitty</text>
          </g>

          <!-- Kitty 贴纸(左下角爱心Kitty) -->
          <g class="env-sticker">
            <path d="M120 130 c-16 -12 -34 -6 -34 10 c0 14 16 24 34 40 c18 -16 34 -26 34 -40 c0 -16 -18 -22 -34 -10 z" fill="#ff8fa3"/>
            <circle cx="120" cy="128" r="24" fill="#fffdfb" stroke="#f0bcc8" stroke-width="3"/>
            <path d="M101 112 L103 94 L118 106 Z" fill="#fffdfb" stroke="#f0bcc8" stroke-width="3" stroke-linejoin="round"/>
            <path d="M139 112 L137 94 L122 106 Z" fill="#fffdfb" stroke="#f0bcc8" stroke-width="3" stroke-linejoin="round"/>
            <circle cx="112" cy="126" r="2.8" fill="#4a3036"/>
            <circle cx="128" cy="126" r="2.8" fill="#4a3036"/>
            <ellipse cx="120" cy="133" rx="4" ry="3" fill="#f7b733"/>
            <g stroke="#e5a8b5" stroke-width="2.2" stroke-linecap="round">
              <path d="M92 128 H104"/><path d="M92 136 H104"/>
              <path d="M136 128 H148"/><path d="M136 136 H148"/>
            </g>
          </g>

          <!-- 信封盖(3D 翻开) -->
          <g class="flap">
            <path d="M42 82 L200 186 L358 82 L358 76 Q358 66 348 66 L52 66 Q42 66 42 76 Z"
                  fill="#ffb6c6" stroke="#e8919f" stroke-width="4" stroke-linejoin="round"/>
            <path d="M70 84 L200 166 L330 84" fill="none" stroke="#ffd3dc" stroke-width="3" stroke-linecap="round"/>
          </g>

          <!-- 火漆印 -->
          <g class="seal">
            <circle cx="200" cy="182" r="24" fill="#e8455f" stroke="#c9334c" stroke-width="3.5"/>
            <path d="M200 194 c-11 -8 -17 -14 -17 -20 c0 -5 4 -9 9 -9 c3 0 6 2 8 5 c2 -3 5 -5 8 -5 c5 0 9 4 9 9 c0 6 -6 12 -17 20 z" fill="#fff0f3"/>
          </g>
        </svg>
      </button>
      <p class="hint">轻点信封,展开里面的信纸 💌</p>
    </section>

    <!-- ══════════ 场景三:信纸(底部有"重新折好信件") ══════════ -->
    <section class="scene scene--letter" id="sceneLetter" aria-label="信纸" hidden>
      <div class="letter-stage">
        <!-- 信纸周围的爱心 Kitty 由 JS 注入 -->
        <div class="heart-kitty-ring" id="heartKittyRing" aria-hidden="true"></div>

        <article class="letter" id="letter">
          <span class="tape tape--l" aria-hidden="true"></span>
          <span class="tape tape--r" aria-hidden="true"></span>

          <!-- ✏️ 想改信的内容,就改下面这一块 -->
          <header class="letter__head">
            <p class="letter__date">2026 年 10 月 12 日 · 晴</p>
            <h1 class="letter__title">给最特别的你</h1>
          </header>

          <div class="letter__body">
            <p>见字如面。</p>
            <p>今天没有什么特别的事,就是忽然很想你。想把这份想念装进信封里,让 Kitty 替我飞过来,送到你手上。</p>
            <p>谢谢你出现在我的生活里,让普通的日子都变得软乎乎、亮晶晶。往后的每一天,开心的事想第一个讲给你听,难过的事也想躲进你怀里。</p>
            <p>这封信可以一直留着。想我的时候,就再打开看一遍。</p>
          </div>

          <footer class="letter__sign">
            <p>—— 永远偏爱你的 <span class="kitty-word">Kitty</span> 🐱</p>
          </footer>
        </article>
      </div>

      <button class="refold-btn" id="refoldBtn" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8h10a4 4 0 0 1 4 4v1h-3v-1a1 1 0 0 0-1-1H7a4 4 0 0 0-4 4v1H1v-1a4 4 0 0 1 3-3.9zM3 15h2v5H3z" fill="currentColor"/></svg>
        重新折好信件
      </button>
    </section>

  </main>

  <!-- 背景音乐:放在 js 之前,方便脚本立即获取 -->
  <audio id="bgm" src="assets/bgm.mp3" loop preload="auto"></audio>
  <script src="js/main.js"></script>
</body>
</html>
