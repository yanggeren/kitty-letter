<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffd1e0" />
  <meta name="description" content="有一封信想送给你,请轻轻拆开 💌" />
  <title>有一封信想送给你 💌</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-scene="fly">

  <!-- ══════════ 背景装饰 ══════════ -->
  <div class="bg-clouds" aria-hidden="true"></div>
  <div class="bg-dots" aria-hidden="true"></div>
  <div class="bg-hearts" aria-hidden="true">
    <span style="--x:8%;  --d:0s;   --s:1;  --c:#ffc0cb">❤</span>
    <span style="--x:22%; --d:2.2s; --s:.7; --c:#ffd7e0">❤</span>
    <span style="--x:37%; --d:4.1s; --s:1.2; --c:#ff8fab">❤</span>
    <span style="--x:52%; --d:1.3s; --s:.8; --c:#ffb6c1">❤</span>
    <span style="--x:67%; --d:3.4s; --s:1;  --c:#ffc0cb">❤</span>
    <span style="--x:81%; --d:.6s;  --s:.9; --c:#ffd7e0">❤</span>
    <span style="--x:93%; --d:2.9s; --s:1.1; --c:#ff8fab">❤</span>
  </div>

  <!-- ══════════ 音乐按钮 & 提示 ══════════ -->
  <button id="musicBtn" class="music-btn" type="button" aria-label="播放或暂停背景音乐">
    <svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13c0 .8.9 1.3 1.6.9l10-6.5c.6-.4.6-1.4 0-1.8l-10-6.5c-.7-.4-1.6.1-1.6.9z"/></svg>
    <svg class="icon icon-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.6"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.6"/></svg>
    <span class="music-btn__label">音乐</span>
  </button>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <main class="stage">

    <!-- ══════════ 场景一:Kitty 带着信封飞来(天使翅膀款) ══════════ -->
    <section class="scene scene--fly" id="sceneFly" aria-label="Kitty 带着信封飞来">
      <button class="flyer" id="flyer" type="button" aria-label="点击收下信件">
        <svg class="flyer__art" viewBox="0 0 300 268" role="img" aria-label="长着粉色翅膀的 Kitty 抱着信封飞来">
          <!-- 速度线 -->
          <g class="speed" stroke="#ffc8d6" stroke-width="5" stroke-linecap="round" fill="none">
            <path d="M14 104 q22 -8 44 -4" />
            <path d="M6 148 q24 -8 48 -4" />
            <path d="M18 192 q20 -7 40 -3" />
          </g>
          <!-- 星星 -->
          <g class="sparkles" fill="#ffd166">
            <path class="tw tw-1" d="M256 58 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 z" />
            <path class="tw tw-2" d="M272 138 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" />
            <path class="tw tw-3" d="M34 44 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" />
          </g>

          <!-- 天使羽翼(左) -->
          <g class="wing wing--l">
            <path d="M130 158 C96 118 58 102 38 106 C48 138 72 168 114 188 C122 192 132 178 130 158 Z"
                  fill="#fffdfb" stroke="#eebdc8" stroke-width="2.8" stroke-linejoin="round"/>
            <path d="M62 120 C82 134 98 150 112 170" stroke="#f6d3dc" stroke-width="2.6" fill="none" stroke-linecap="round"/>
            <path d="M52 140 C74 150 94 162 106 178" stroke="#f6d3dc" stroke-width="2.6" fill="none" stroke-linecap="round"/>
            <path d="M70 110 C90 122 106 136 118 152" stroke="#f6d3dc" stroke-width="2.6" fill="none" stroke-linecap="round"/>
          </g>
          <!-- 天使羽翼(右) -->
          <g class="wing wing--r">
            <path d="M170 158 C204 118 242 102 262 106 C252 138 228 168 186 188 C178 192 168 178 170 158 Z"
                  fill="#fffdfb" stroke="#eebdc8" stroke-width="2.8" stroke-linejoin="round"/>
            <path d="M238 120 C218 134 202 150 188 170" stroke="#f6d3dc" stroke-width="2.6" fill="none" stroke-linecap="round"/>
            <path d="M248 140 C226 150 206 162 194 178" stroke="#f6d3dc" stroke-width="2.6" fill="none" stroke-linecap="round"/>
            <path d="M230 110 C210 122 194 136 182 152" stroke="#f6d3dc" stroke-width="2.6" fill="none" stroke-linecap="round"/>
          </g>

          <!-- 尾巴 -->
          <path d="M200 210 q32 2 40 -22 q4 25 -17 36 q-17 6 -23 -14 z" fill="#fffdfb" stroke="#eebdc8" stroke-width="2.8" stroke-linejoin="round"/>

          <!-- 身体(大头小身 Q 版) -->
          <ellipse cx="150" cy="196" rx="50" ry="42" fill="#fffdfb" stroke="#eebdc8" stroke-width="2.8"/>
          <!-- 脚 -->
          <ellipse cx="127" cy="236" rx="15.5" ry="9" fill="#fffdfb" stroke="#eebdc8" stroke-width="2.8"/>
          <ellipse cx="173" cy="236" rx="15.5" ry="9" fill="#fffdfb" stroke="#eebdc8" stroke-width="2.8"/>

          <!-- 头 -->
          <circle cx="150" cy="112" r="50" fill="#fffdfb" stroke="#eebdc8" stroke-width="2.8"/>
          <!-- 耳朵 -->
          <path d="M112 78 L118 34 L149 55 Z" fill="#fffdfb" stroke="#eebdc8" stroke-width="2.8" stroke-linejoin="round"/>
          <path d="M188 78 L182 34 L151 55 Z" fill="#fffdfb" stroke="#eebdc8" stroke-width="2.8" stroke-linejoin="round"/>
          <!-- 蝴蝶结(戴在耳朵上 · 深玫粉) -->
          <g class="bow" transform="translate(187 50) rotate(14)">
            <path d="M-4 -2 C-17 -17 -32 -13 -30 -1 C-28 11 -13 11 -4 3 Z" fill="#ff69b4" stroke="#e8449b" stroke-width="2.6" stroke-linejoin="round"/>
            <path d="M4 -2 C17 -17 32 -13 30 -1 C28 11 13 11 4 3 Z" fill="#ff69b4" stroke="#e8449b" stroke-width="2.6" stroke-linejoin="round"/>
            <ellipse cx="0" cy="0" rx="6.5" ry="8" fill="#ff8fc0" stroke="#e8449b" stroke-width="2.6"/>
          </g>
          <!-- 脸:闭眼笑(开心款) -->
          <path d="M124 110 q10 -13 20 0" stroke="#3a2c31" stroke-width="4.2" fill="none" stroke-linecap="round"/>
          <path d="M156 110 q10 -13 20 0" stroke="#3a2c31" stroke-width="4.2" fill="none" stroke-linecap="round"/>
          <!-- 腮红 -->
          <ellipse cx="118" cy="126" rx="10.5" ry="6.8" fill="#ffb3c4" opacity=".8"/>
          <ellipse cx="182" cy="126" rx="10.5" ry="6.8" fill="#ffb3c4" opacity=".8"/>
          <!-- 鼻子 -->
          <ellipse cx="150" cy="124" rx="6.5" ry="4.5" fill="#ffc61e"/>
          <!-- 微笑 -->
          <path d="M142 136 q8 7 16 0" stroke="#3a2c31" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          <!-- 胡须(浅粉细线) -->
          <g stroke="#eebdc8" stroke-width="2.2" stroke-linecap="round">
            <path d="M88 112 H112"/><path d="M88 124 H112"/><path d="M90 136 H113"/>
            <path d="M188 112 H212"/><path d="M188 124 H212"/><path d="M187 136 H210"/>
          </g>

          <!-- 抱着的信封 -->
          <g class="parcel">
            <rect x="100" y="160" width="100" height="66" rx="9" fill="#ffd7e2" stroke="#f0a8bc" stroke-width="2.8"/>
            <path d="M100 168 L150 202 L200 168" fill="none" stroke="#f0a8bc" stroke-width="2.8" stroke-linejoin="round"/>
            <path d="M150 212 c-11 -8 -17 -14 -17 -19 c0 -5 4 -8 8 -8 c3 0 6 2 9 5 c3 -3 6 -5 9 -5 c4 0 8 3 8 8 c0 5 -6 11 -17 19 z" fill="#e63946"/>
            <!-- 小邮票 -->
            <g transform="translate(166 162)">
              <rect x="0" y="0" width="26" height="30" rx="3.5" fill="#fff3f6" stroke="#f0a8bc" stroke-width="2" stroke-dasharray="4 3"/>
              <circle cx="13" cy="12" r="7" fill="#fffdfb" stroke="#eebdc8" stroke-width="1.6"/>
              <circle cx="10.5" cy="11" r="1.3" fill="#3a2c31"/>
              <circle cx="15.5" cy="11" r="1.3" fill="#3a2c31"/>
              <ellipse cx="13" cy="14" rx="1.8" ry="1.3" fill="#ffc61e"/>
            </g>
            <!-- 爪子 -->
            <circle cx="108" cy="200" r="14.5" fill="#fffdfb" stroke="#eebdc8" stroke-width="2.8"/>
            <circle cx="192" cy="200" r="14.5" fill="#fffdfb" stroke="#eebdc8" stroke-width="2.8"/>
          </g>
        </svg>
        <span class="flyer__pulse" aria-hidden="true"></span>
      </button>
      <p class="hint" id="flyHint">有一封信,想送给你 ♡</p>
      <p class="hint-sub">轻点 Kitty 怀里的信封,收下它</p>
    </section>

    <!-- ══════════ 场景二:信封(不含"重新折好信件"按钮) ══════════ -->
    <section class="scene scene--envelope" id="sceneEnvelope" aria-label="信封" hidden>
      <button class="envelope-wrap" id="envelopeBtn" type="button" aria-label="点击拆开信封,展开信纸">
        <svg class="envelope-art" viewBox="0 0 420 320" role="img" aria-label="一封浅粉色、贴着 Kitty 邮票的信封">
          <!-- 影子 -->
          <ellipse cx="210" cy="302" rx="156" ry="13" fill="#f0a8bc" opacity=".35"/>

          <!-- 挂在信封边上的小红心 -->
          <g class="env-sparkles" fill="#ff4757">
            <path class="es es-1" d="M40 86 c-6 -8 -17 -4 -17 5 c0 7 8 12 17 19 c9 -7 17 -12 17 -19 c0 -9 -11 -13 -17 -5 z"/>
            <path class="es es-2" d="M382 122 c-5 -7 -14 -4 -14 4 c0 6 6 10 14 16 c8 -6 14 -10 14 -16 c0 -8 -9 -11 -14 -4 z"/>
            <path class="es es-3" d="M368 58 c-4 -5 -10 -3 -10 3 c0 4 5 8 10 12 c5 -4 10 -8 10 -12 c0 -6 -6 -8 -10 -3 z"/>
            <path class="es es-4" d="M28 168 c-4 -5 -10 -3 -10 3 c0 4 5 8 10 12 c5 -4 10 -8 10 -12 c0 -6 -6 -8 -10 -3 z"/>
          </g>

          <!-- 信封本体 -->
          <rect x="52" y="84" width="316" height="188" rx="16" fill="#ffc8d6" stroke="#f0a8bc" stroke-width="2.8"/>
          <rect x="65" y="97" width="290" height="162" rx="10" fill="none" stroke="#ffd7e0" stroke-width="2" stroke-dasharray="2 9" stroke-linecap="round"/>

          <!-- 正面简笔 Kitty 头像 -->
          <g transform="translate(91,178) scale(.62)">
            <circle cx="60" cy="64" r="45" fill="#fffdfb" stroke="#eebdc8" stroke-width="3"/>
            <path d="M25 44 L31 15 L52 30 Z" fill="#fffdfb" stroke="#eebdc8" stroke-width="3" stroke-linejoin="round"/>
            <path d="M95 44 L89 15 L68 30 Z" fill="#fffdfb" stroke="#eebdc8" stroke-width="3" stroke-linejoin="round"/>
            <g transform="translate(92 28) rotate(12)">
              <path d="M-3 -1 C-12 -12 -23 -9 -22 -1 C-21 8 -10 8 -3 2 Z" fill="#ff69b4" stroke="#e8449b" stroke-width="2" stroke-linejoin="round"/>
              <path d="M3 -1 C12 -12 23 -9 22 -1 C21 8 10 8 3 2 Z" fill="#ff69b4" stroke="#e8449b" stroke-width="2" stroke-linejoin="round"/>
              <ellipse cx="0" cy="0" rx="4.6" ry="5.6" fill="#ff8fc0" stroke="#e8449b" stroke-width="2"/>
            </g>
            <circle cx="44" cy="62" r="5" fill="#3a2c31"/>
            <circle cx="76" cy="62" r="5" fill="#3a2c31"/>
            <ellipse cx="60" cy="73" rx="6.5" ry="4.5" fill="#ffc61e"/>
            <path d="M53 83 q7 6 14 0" stroke="#3a2c31" stroke-width="2.4" fill="none" stroke-linecap="round"/>
            <ellipse cx="34" cy="76" rx="8" ry="5.5" fill="#ffb3c4" opacity=".8"/>
            <ellipse cx="86" cy="76" rx="8" ry="5.5" fill="#ffb3c4" opacity=".8"/>
            <g stroke="#eebdc8" stroke-width="2.4" stroke-linecap="round">
              <path d="M8 58 H28"/><path d="M8 70 H28"/><path d="M10 82 H29"/>
              <path d="M92 58 H112"/><path d="M92 70 H112"/><path d="M91 82 H110"/>
            </g>
          </g>

          <!-- 邮票(锯齿边 + Kitty 头像 + 灰色波浪邮戳) -->
          <g transform="translate(286,196) rotate(3)">
            <rect x="0" y="0" width="66" height="80" rx="6" fill="#ffe3ea" stroke="#f0a8bc" stroke-width="2.4" stroke-dasharray="7 5"/>
            <g transform="translate(-4,-12) scale(.52)">
              <circle cx="60" cy="64" r="42" fill="#fffdfb" stroke="#eebdc8" stroke-width="3.4"/>
              <path d="M27 46 L33 18 L53 32 Z" fill="#fffdfb" stroke="#eebdc8" stroke-width="3.4" stroke-linejoin="round"/>
              <path d="M93 46 L87 18 L67 32 Z" fill="#fffdfb" stroke="#eebdc8" stroke-width="3.4" stroke-linejoin="round"/>
              <circle cx="45" cy="63" r="5" fill="#3a2c31"/>
              <circle cx="75" cy="63" r="5" fill="#3a2c31"/>
              <ellipse cx="60" cy="74" rx="6.5" ry="4.5" fill="#ffc61e"/>
            </g>
            <text x="33" y="72" text-anchor="middle" font-size="13" fill="#e8449b" font-weight="700">Kitty</text>
            <!-- 邮戳波浪线 -->
            <g stroke="#b9a8ae" stroke-width="2" fill="none" opacity=".8" stroke-linecap="round">
              <path d="M-6 26 q11 -7 22 0 t22 0 t22 0 t22 0"/>
              <path d="M-6 38 q11 -7 22 0 t22 0 t22 0 t22 0"/>
            </g>
          </g>

          <!-- 信封盖(3D 翻开) -->
          <g class="flap">
            <path d="M52 98 Q52 84 66 84 L354 84 Q368 84 368 98 L210 206 Z"
                  fill="#ffb6c1" stroke="#f0a8bc" stroke-width="2.8" stroke-linejoin="round"/>
            <path d="M86 100 L210 188 L334 100" fill="none" stroke="#ffd7e0" stroke-width="2.4" stroke-linecap="round"/>
          </g>

          <!-- 立体心形封扣 -->
          <g class="seal">
            <ellipse cx="210" cy="218" rx="27" ry="7" fill="#e08ba0" opacity=".4"/>
            <path d="M210 218 c-15 -11 -23 -19 -23 -27 c0 -7 5 -12 12 -12 c5 0 8 3 11 7 c3 -4 6 -7 11 -7 c7 0 12 5 12 12 c0 8 -8 16 -23 27 z"
                  fill="#e63946" stroke="#c62f3c" stroke-width="2.8" stroke-linejoin="round"/>
          </g>
        </svg>
      </button>
      <p class="hint">拆开看看吧 ~</p>
    </section>

    <!-- ══════════ 场景三:信纸(底部有"重新折好信件") ══════════ -->
    <section class="scene scene--letter" id="sceneLetter" aria-label="信纸" hidden>
      <div class="letter-stage">
        <!-- 信纸周围的爱心 Kitty 由 JS 注入 -->
        <div class="heart-kitty-ring" id="heartKittyRing" aria-hidden="true"></div>

        <!-- 信纸下方的打开信封(信纸从这里抽出来) -->
        <div class="open-envelope" aria-hidden="true">
          <svg viewBox="0 0 420 240">
            <path d="M118 88 L210 8 L302 88 Z" fill="#ffd0dc" stroke="#f0a8bc" stroke-width="2.6" stroke-linejoin="round"/>
            <path d="M210 78 c-12 -9 -19 -15 -19 -22 c0 -6 4 -10 10 -10 c4 0 7 2 9 6 c2 -4 5 -6 9 -6 c6 0 10 4 10 10 c0 7 -7 13 -19 22 z" fill="#e63946" stroke="#c62f3c" stroke-width="2.4" stroke-linejoin="round"/>
            <rect x="122" y="66" width="176" height="42" rx="7" fill="#fffdfb" stroke="#f0a8bc" stroke-width="2.2"/>
            <path d="M150 82 h120" stroke="#f6d3dc" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M150 94 h84" stroke="#f6d3dc" stroke-width="2.2" stroke-linecap="round"/>
            <rect x="96" y="88" width="228" height="132" rx="14" fill="#ffb6c1" stroke="#f0a8bc" stroke-width="2.8"/>
            <path d="M96 102 L210 178 L324 102" fill="none" stroke="#ffd7e0" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M210 206 c-11 -8 -17 -14 -17 -20 c0 -5 4 -9 9 -9 c4 0 6 2 8 5 c2 -3 4 -5 8 -5 c5 0 9 4 9 9 c0 6 -6 12 -17 20 z" fill="#e63946" stroke="#c62f3c" stroke-width="2.2" stroke-linejoin="round"/>
            <g fill="#ff4757">
              <path d="M76 172 c-5 -7 -14 -4 -14 4 c0 6 6 10 14 16 c8 -6 14 -10 14 -16 c0 -8 -9 -11 -14 -4 z"/>
              <path d="M344 186 c-4 -6 -12 -3 -12 3 c0 5 5 9 12 14 c7 -5 12 -9 12 -14 c0 -6 -8 -9 -12 -3 z"/>
            </g>
          </svg>
        </div>

        <article class="letter" id="letter">
          <!-- 信纸四角的贴纸装饰 -->
          <span class="deco deco--kitty" aria-hidden="true">
            <svg viewBox="0 0 120 120">
              <circle cx="60" cy="64" r="45" fill="#fffdfb" stroke="#eebdc8" stroke-width="2.6"/>
              <path d="M25 44 L31 15 L52 30 Z" fill="#fffdfb" stroke="#eebdc8" stroke-width="2.6" stroke-linejoin="round"/>
              <path d="M95 44 L89 15 L68 30 Z" fill="#fffdfb" stroke="#eebdc8" stroke-width="2.6" stroke-linejoin="round"/>
              <path d="M90 26 C80 13 66 16 68 27 C70 37 83 38 90 30 Z" fill="#ff69b4" stroke="#e8449b" stroke-width="2.2" stroke-linejoin="round"/>
              <path d="M95 26 C105 13 119 16 117 27 C115 37 102 38 95 30 Z" fill="#ff69b4" stroke="#e8449b" stroke-width="2.2" stroke-linejoin="round"/>
              <ellipse cx="92.5" cy="27" rx="5.5" ry="6.5" fill="#ff8fc0" stroke="#e8449b" stroke-width="2.2"/>
              <circle cx="44" cy="62" r="4.8" fill="#3a2c31"/>
              <circle cx="76" cy="62" r="4.8" fill="#3a2c31"/>
              <ellipse cx="60" cy="73" rx="6.2" ry="4.3" fill="#ffc61e"/>
              <path d="M53 83 q7 6 14 0" stroke="#3a2c31" stroke-width="2.3" fill="none" stroke-linecap="round"/>
              <ellipse cx="34" cy="76" rx="8" ry="5.5" fill="#ffb3c4" opacity=".8"/>
              <ellipse cx="86" cy="76" rx="8" ry="5.5" fill="#ffb3c4" opacity=".8"/>
              <g stroke="#eebdc8" stroke-width="2.3" stroke-linecap="round">
                <path d="M8 58 H28"/><path d="M8 70 H28"/><path d="M10 82 H29"/>
                <path d="M92 58 H112"/><path d="M92 70 H112"/><path d="M91 82 H110"/>
              </g>
            </svg>
          </span>
          <span class="deco deco--bear" aria-hidden="true">
            <svg viewBox="0 0 100 100">
              <circle cx="26" cy="26" r="15" fill="#a9745d"/>
              <circle cx="74" cy="26" r="15" fill="#a9745d"/>
              <circle cx="26" cy="26" r="7.5" fill="#c89078"/>
              <circle cx="74" cy="26" r="7.5" fill="#c89078"/>
              <circle cx="50" cy="56" r="31" fill="#a9745d"/>
              <ellipse cx="50" cy="66" rx="17" ry="13" fill="#c89078"/>
              <circle cx="38" cy="50" r="3.4" fill="#3a2c31"/>
              <circle cx="62" cy="50" r="3.4" fill="#3a2c31"/>
              <ellipse cx="50" cy="61" rx="5" ry="3.6" fill="#3a2c31"/>
              <path d="M50 65 v4 M50 69 q-5 4 -8 0 M50 69 q5 4 8 0" stroke="#3a2c31" stroke-width="2" fill="none" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="deco deco--bow" aria-hidden="true">
            <svg viewBox="0 0 120 80">
              <path d="M52 40 C28 10 4 18 10 38 C15 55 40 56 52 46 Z" fill="#ff69b4" stroke="#e8449b" stroke-width="3" stroke-linejoin="round"/>
              <path d="M68 40 C92 10 116 18 110 38 C105 55 80 56 68 46 Z" fill="#ff69b4" stroke="#e8449b" stroke-width="3" stroke-linejoin="round"/>
              <ellipse cx="60" cy="41" rx="11" ry="13" fill="#ff8fc0" stroke="#e8449b" stroke-width="3"/>
            </svg>
          </span>
          <span class="deco deco--flower" aria-hidden="true">
            <svg viewBox="0 0 60 60">
              <g fill="#fffdfb" stroke="#f3c4d2" stroke-width="2">
                <ellipse cx="30" cy="12" rx="9" ry="11"/>
                <ellipse cx="30" cy="48" rx="9" ry="11"/>
                <ellipse cx="12" cy="30" rx="11" ry="9"/>
                <ellipse cx="48" cy="30" rx="11" ry="9"/>
              </g>
              <circle cx="30" cy="30" r="9" fill="#ffd166"/>
            </svg>
          </span>
          <span class="deco deco--heart deco--heart-a" aria-hidden="true">❤</span>
          <span class="deco deco--heart deco--heart-b" aria-hidden="true">❤</span>

          <!-- ✏️ 想改信的内容,就改下面这一块 -->
          <header class="letter__head">
            <p class="letter__date">2026 年 10 月 12 日 · 晴</p>
            <h1 class="letter__title">给最特別的你 ♡</h1>
          </header>

          <div class="letter__body">
            <p>哈喽，我亲爱的猪猪🐷</p>
            <p>哈哈，又是很长时间没有给你写信和做这些小玩意了，但是你说的不错，我不能以工作太忙了或者其他的原因就疏忽掉你的感受，所以我给你做一个这个
              虽然是个小玩意，但是，我想这也能代表着我永远爱你的心💖
            </p>
          </div>

          <footer class="letter__sign">
            <p>—— 永远爱你 <span class="kitty-word"></span> </p>
          </footer>
        </article>
      </div>
